<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
  <defs>
    <!-- Background Gradient (Deep Obsidian to Midnight Slate) -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="48%" stop-color="#0B1322"/>
      <stop offset="100%" stop-color="#04060B"/>
    </linearGradient>

    <!-- Radiant Greek π Gradient -->
    <linearGradient id="grad-pi-radiant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="42%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Radar Sweep Cone Gradient -->
    <linearGradient id="grad-radar-cone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Dot Grid for Technical Texture -->
    <pattern id="ui-dot-grid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#38BDF8" opacity="0.12"/>
    </pattern>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
  </defs>

  <!-- Base Card Container -->
  <rect width="960" height="360" rx="18" fill="url(#bg-canvas)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="960" height="360" rx="18" fill="url(#ui-dot-grid)"/>

  <!-- Golden Ratio Corner Calipers -->
  <path d="M 18 36 L 18 18 L 36 18" fill="none" stroke="#2DD4BF" stroke-width="1.5" opacity="0.6"/>
  <path d="M 942 36 L 942 18 L 924 18" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <path d="M 18 324 L 18 342 L 36 342" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <path d="M 942 324 L 942 342 L 924 342" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.6"/>

  <!-- ========================================================================= -->
  <!-- LEFT ZONE (38.2% Golden Section): ATTENTION RADAR & HERO π GLYPH          -->
  <!-- ========================================================================= -->
  <g transform="translate(16, 26)">
    <!-- Radar Sweep Cone (Laser Attention Scope) -->
    <path d="M 170 136 L 244 74 A 92 92 0 0 0 102 68 Z" fill="url(#grad-radar-cone)"/>

    <!-- Concentric Attention Orbits (Golden-Ratio Radii: 50 -> 72 -> 92) -->
    <circle cx="170" cy="136" r="92" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 6" opacity="0.32"/>
    <circle cx="170" cy="136" r="72" fill="none" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.48"/>

    <!-- Crosshair Cardinal Guides -->
    <line x1="170" y1="38" x2="170" y2="52" stroke="#2DD4BF" stroke-width="1.5" opacity="0.8"/>
    <line x1="170" y1="220" x2="170" y2="234" stroke="#2DD4BF" stroke-width="1.5" opacity="0.8"/>
    <line x1="72" y1="136" x2="86" y2="136" stroke="#2DD4BF" stroke-width="1.5" opacity="0.8"/>
    <line x1="254" y1="136" x2="268" y2="136" stroke="#2DD4BF" stroke-width="1.5" opacity="0.8"/>

    <!-- Central Focal Vault -->
    <circle cx="170" cy="136" r="50" fill="#0C1527" stroke="url(#grad-pi-radiant)" stroke-width="2"/>

    <!-- Radiant Mathematical π Glyph (Vector-sharp, zero blur artifact) -->
    <text class="sans" x="170" y="160" font-size="72" font-weight="900" text-anchor="middle" fill="url(#grad-pi-radiant)">π</text>

    <!-- 4-Character Hash Satellites (Locking Active Coordinates) -->
    <!-- North Anchor -->
    <rect class="mono" x="147" y="33" width="46" height="22" rx="5" fill="#091428" stroke="#38BDF8" stroke-width="1.2"/>
    <text class="mono" x="170" y="48" font-size="10.5" font-weight="800" text-anchor="middle" fill="#38BDF8">szJx</text>

    <!-- East Anchor -->
    <rect class="mono" x="228" y="125" width="46" height="22" rx="5" fill="#042220" stroke="#2DD4BF" stroke-width="1.2"/>
    <text class="mono" x="251" y="140" font-size="10.5" font-weight="800" text-anchor="middle" fill="#2DD4BF">kQmx</text>

    <!-- South Anchor -->
    <rect class="mono" x="147" y="217" width="46" height="22" rx="5" fill="#12102E" stroke="#818CF8" stroke-width="1.2"/>
    <text class="mono" x="170" y="232" font-size="10.5" font-weight="800" text-anchor="middle" fill="#A5B4FC">a1bX</text>

    <!-- West Anchor -->
    <rect class="mono" x="66" y="125" width="46" height="22" rx="5" fill="#042220" stroke="#2DD4BF" stroke-width="1.2"/>
    <text class="mono" x="89" y="140" font-size="10.5" font-weight="800" text-anchor="middle" fill="#2DD4BF">c3dX</text>

    <!-- Badge: Free your model's Attention (Centered Horizontally & Vertically) -->
    <g transform="translate(42, 252)">
      <rect width="256" height="32" rx="16" fill="#032D38" fill-opacity="0.8" stroke="#0D9488" stroke-width="1.2"/>
      <circle cx="20" cy="16" r="4" fill="#2DD4BF"/>
      <text class="mono" x="135" y="20.5" font-size="11" font-weight="700" text-anchor="middle" fill="#5EEAD4" letter-spacing="0.3">Free your model's Attention</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT ZONE (61.8% Golden Section): HIERARCHY, NORTH STAR & 3 PILLARS      -->
  <!-- ========================================================================= -->
  <g transform="translate(370, 32)">
    <!-- Level 1 Hierarchy: Category Kicker -->
    <text class="mono" x="0" y="16" font-size="11.5" font-weight="800" fill="#2DD4BF" letter-spacing="1.8">
      (FILE, CONTENT)-ADDRESSED LINE-IDENTITY MVCC
    </text>

    <!-- Level 2 Hierarchy: Brand Identity Hero -->
    <text class="sans" x="0" y="62" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      pi-better-edit
    </text>

    <!-- Level 3 Hierarchy: The North Star Philosophy Quote Box (Loosened Spacing) -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="554" height="38" rx="8" fill="#0A182E" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
      <text class="mono" x="16" y="24" font-size="13" font-weight="700" fill="#38BDF8">
        "Context space is the scarce resource; host compute is free."
      </text>
    </g>

    <!-- ======================================================================= -->
    <!-- 3-PILLAR CARDS (Centered Horizontally & Vertically, Loosened Spacing)    -->
    <!-- ======================================================================= -->
    <g transform="translate(0, 150)">
      <!-- Pillar 1: 4-Char Base62 Anchors -->
      <g>
        <rect width="174" height="74" rx="10" fill="#081A24" stroke="#2DD4BF" stroke-width="1.2"/>
        <text class="sans" x="87" y="33" font-size="14" font-weight="800" fill="#2DD4BF" text-anchor="middle">4-Char Base62</text>
        <text class="sans" x="87" y="55" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">14.7M unique anchors</text>
      </g>

      <!-- Pillar 2: Context Model -->
      <g transform="translate(190, 0)">
        <rect width="174" height="74" rx="10" fill="#0E142C" stroke="#818CF8" stroke-width="1.2"/>
        <text class="sans" x="87" y="33" font-size="14" font-weight="800" fill="#A5B4FC" text-anchor="middle">Context Model</text>
        <text class="sans" x="87" y="55" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">-58% tokens (arXiv)</text>
      </g>

      <!-- Pillar 3: Zero-Token Rebase -->
      <g transform="translate(380, 0)">
        <rect width="174" height="74" rx="10" fill="#1A0E22" stroke="#F472B6" stroke-width="1.2"/>
        <text class="sans" x="87" y="33" font-size="14" font-weight="800" fill="#F472B6" text-anchor="middle">0-Token Rebase</text>
        <text class="sans" x="87" y="55" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">Patience LIS shift-free</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM STATUS STRIP (Centered Horizontally & Vertically Across Strip)      -->
  <!-- ========================================================================= -->
  <g transform="translate(36, 302)">
    <rect width="888" height="38" rx="8" fill="#090E1A" stroke="#1E293B" stroke-width="1.2"/>
    
    <g class="mono" font-size="11.5" font-weight="600">
      <!-- Item 1: Storage (Centered in Section 1) -->
      <circle cx="85" cy="19" r="4" fill="#2DD4BF"/>
      <text x="98" y="23.5" fill="#F1F5F9">MVCC SQLite WAL</text>
      <text x="296" y="23.5" fill="#475569" text-anchor="middle">|</text>

      <!-- Item 2: Multi-Session (Centered in Section 2) -->
      <circle cx="365" cy="19" r="4" fill="#38BDF8"/>
      <text x="378" y="23.5" fill="#F1F5F9">Multi-Session Leases</text>
      <text x="592" y="23.5" fill="#475569" text-anchor="middle">|</text>

      <!-- Item 3: Fail-Closed (Centered in Section 3) -->
      <circle cx="612" cy="19" r="4" fill="#34D399"/>
      <text x="625" y="23.5" fill="#F1F5F9">Fail-Closed Reject &amp; Serve (1-Turn Recovery)</text>
    </g>
  </g>
</svg>
