name: Changelog Check
on:
  pull_request:
    branches: [main]
    # `edited` is load-bearing for BOTH fields the gate reads. The TITLE is audited as
    # --squash-title, so a retitle after the last push would never be re-audited (a `feat`
    # title could be pushed, pass, then be retitled to `perf` and merged); retitling is also
    # exactly how a bump-alignment finding is fixed, so the fix must re-trigger the audit. The
    # BODY carries the `Ledger-Waiver:` and `Landing:` trailers, whose documented remedy is
    # "add the trailer and re-run" — without `edited` that re-run never happens on its own.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: changelog-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      # The gate audits the PR title as *the landed squash subject*, and that equivalence holds
      # only while this repo sets `squash_merge_commit_title: PR_TITLE`. A repo setting has no
      # diff, so nothing else pins it: a silent flip back to COMMIT_OR_PR_TITLE re-opens the #166
      # defect (patch release carrying feature notes) behind a green check.
      #
      # The setting itself is unreadable here: the REST repository payload omits
      # `squash_merge_commit_title` to callers without admin, and the workflow token has none.
      # Assert the OUTCOME instead. Under PR_TITLE every squash lands `<title> (#N)`; under the
      # COMMIT_OR_PR_TITLE default a single-commit PR lands its bare commit title, with no number.
      # Only semantic-release's own push and a merge-commit landing legitimately lack the suffix.
      - name: Landed subject is the PR title
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          subject=$(git log -1 --format=%s)
          case "$subject" in
            "chore(release): "* | "Merge "*)
              echo "::warning::no PR title involved in this push; skipping the squash-subject check: $subject"
              exit 0
              ;;
          esac
          pr=$(printf '%s\n' "$subject" | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p')
          if [ -z "$pr" ]; then
            echo "::error::landed subject has no (#N) suffix: '$subject'"
            echo "::error::under squash_merge_commit_title=PR_TITLE every squash lands '<PR title> (#N)'; a bare subject means the repo setting flipped back, so the ledger gate audited a title that never landed."
            echo "::error::fix: gh api -X PATCH repos/${GITHUB_REPOSITORY} -f squash_merge_commit_title=PR_TITLE"
            exit 1
          fi
          expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .title) || exit 1
          if [ "$subject" != "${expected} (#${pr})" ]; then
            echo "::error::landed subject '${subject}' is not '${expected} (#${pr})': the squash subject did not come from the PR title, so the ledger gate audited a string that never landed."
            exit 1
          fi
          echo "ok: landed subject matches PR #${pr}"
      # The deterministic floor (ADR-0016), replacing the old synchronisation
      # check: the ledger is curated, not a projection of commit subjects, so
      # `update`-equality is no longer the invariant. On a PR the floor is given
      # the landing declaration and the PR number; on main it is the durable
      # run, where every entry must resolve to a landing commit.
      - name: Ledger floor
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          if [ -z "$PR_NUMBER" ]; then
            python scripts/changelog-gate.py ledger
            exit $?
          fi
          waiver=$(printf '%s\n' "$PR_BODY" \
            | sed -n 's/^[[:space:]]*[Ll]edger-[Ww]aiver:[[:space:]]*//p' \
            | head -n 1)
          landing=$(printf '%s\n' "$PR_BODY" \
            | sed -n 's/^[[:space:]]*Landing:[[:space:]]*\([a-z]*\).*/\1/p' \
            | head -n 1)
          args=(--pr "$PR_NUMBER")
          if [ -n "$waiver" ]; then
            echo "waiver: $waiver"
            args+=(--waiver "$waiver")
          fi
          if [ -n "$landing" ]; then
            echo "landing: $landing"
            args+=(--landing "$landing")
          fi
          if [ -n "$PR_TITLE" ]; then
            args+=(--squash-title "$PR_TITLE")
          fi
          python scripts/changelog-gate.py ledger "${args[@]}"
      - name: Comment on failure
        if: failure() && github.event_name == 'pull_request'
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const pr = context.issue.number;
            const body = [
              '> [!warning] Changelog ledger check failed',
              '',
              'The `## [Unreleased]` block did not pass verification: well-formedness,',
              'section integrity, duplicate identities, placeholders, PR attribution, or the',
              'squash-title audit: every `### Section` this PR ships must fit inside the release',
              'level its title licenses (`feat` for Features, `fix`/`perf` for Bug Fixes).',
              '',
              'Every new entry must name this PR (`(#' + pr + ')`). Multiple entries are allowed.',
              '',
              '```bash',
              'uv run scripts/changelog-gate.py ledger --pr ' + pr + ' --squash-title "<this PR title>"',
              '```',
              '',
              'A blocked ledger is waived only with a recorded reason: add a',
              '`Ledger-Waiver: <reason>` trailer to this PR body and re-run.',
              'The gate waives fixable findings only, never a needs-human one.',
            ].join('\n');
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr
            });
            const seen = comments.some(
              c => c.body.includes('Changelog ledger check failed')
            );
            if (seen) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body
            });
